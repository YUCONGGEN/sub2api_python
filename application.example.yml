  billing:
    currency: CNY
    # 兑换码前缀由配置统一控制，修改后新生成的兑换码和前端占位提示会同步更新。
    recharge-code-prefix: ${ROSE_RECHARGE_CODE_PREFIX:CODE}
    # 按上游原始 token 数计费，倍率为 1.0，可按环境覆盖
    price-multiplier: 1.0
    default-input-usd-per-million: 4.0
    default-output-usd-per-million: 20.0
    default-cache-usd-per-million: 0.4
    usd-to-cny: 7.2
    min-recharge: 10
    # 管理员生成的兑换码默认 48 小时内有效，过期后自动失效。
    recharge-code-expire-hours: 48
    # 余额低于 0.001 元时拒绝模型请求；任何扣费后余额都不会低于 -0.1 元。
    min-usable-balance: 0.001
    minimum-balance: -0.1
  # Codex CLI / App / IDE 的配置来源。前端教程和部署脚本可据此生成
  # ~/.codex/config.toml；密钥字段仍支持环境变量覆盖。
  codex:
    model: gpt-5.6-sol
    model-provider: rose
    model-reasoning-effort: high
    approval-policy: on-request
    sandbox-mode: workspace-write
    disable-response-storage: true
    providers:
      rose:
        name: Rose API
        base-url: ${ROSE_OPENAI_BASE_URL:https://coloful-rose.com/v1}
        experimental-bearer-token: ${ROSE_OPENAI_API_KEY:}
        wire-api: responses
        supports-websockets: false
  payment:
    demo-mode: true
    notify-base-url: ${PAYMENT_NOTIFY_BASE_URL:http://localhost:8241}
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      # 是否在普通用户充值页显示该支付方式；默认隐藏。
      visible-to-users: ${WECHAT_PAY_VISIBLE_TO_USERS:false}
      gateway: ${WECHAT_PAY_GATEWAY:https://api.mch.weixin.qq.com}
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
      private-key: ${WECHAT_PRIVATE_KEY:}
      cert-serial-no: ${WECHAT_CERT_SERIAL_NO:}
      platform-cert-path: ${WECHAT_PLATFORM_CERT_PATH:}
      platform-cert-serial-no: ${WECHAT_PLATFORM_CERT_SERIAL_NO:}
    alipay:
      enabled: ${ALIPAY_ENABLED:false}
      # 是否在普通用户充值页显示该支付方式；默认隐藏。
      visible-to-users: ${ALIPAY_VISIBLE_TO_USERS:false}
      app-id: ${ALIPAY_APP_ID:}
      seller-id: ${ALIPAY_SELLER_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      private-key-path: ${ALIPAY_PRIVATE_KEY_PATH:}
      public-key: ${ALIPAY_PUBLIC_KEY:}
      public-key-path: ${ALIPAY_PUBLIC_KEY_PATH:}
      gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    personal-wechat:
      enabled: ${PERSONAL_WECHAT_ENABLED:true}
      # 是否显示个人微信充值区；默认隐藏，不影响兑换码、套餐和历史权益。
      visible-to-users: ${PERSONAL_WECHAT_VISIBLE_TO_USERS:false}
      asset-dir: ${PERSONAL_WECHAT_QR_DIR:./wexin_pay}
      fallback-asset-dir: ./weixin_pay
      tail-min: 0.01
      tail-max: 0.05
      contact-qq: "1516933915"
      contact-wechat: "17739798184"
      # 配置后，独立监听器需在 X-Personal-Callback-Token 请求头携带同值
      callback-token: ${PERSONAL_WECHAT_CALLBACK_TOKEN:}
      listener-stale-seconds: 15
      alert-email:
        recipient: "1516933915@qq.com"
        smtp:
          host: ${PERSONAL_WECHAT_SMTP_HOST:smtp.qq.com}
          port: ${PERSONAL_WECHAT_SMTP_PORT:465}
          ssl: ${PERSONAL_WECHAT_SMTP_SSL:true}
          username: ${PERSONAL_WECHAT_SMTP_USERNAME:}
          password: ${PERSONAL_WECHAT_SMTP_PASSWORD:}
          sender: ${PERSONAL_WECHAT_SMTP_SENDER:}
      qr-crop:
        left: 330
        top: 500
        right: 950
        bottom: 1130
  database:
    path: ${ROSE_DB_PATH:./data/rose.db}
