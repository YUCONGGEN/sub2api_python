server:
  host: 0.0.0.0
  port: 8241
  cors:
    allow-origins:
      - http://localhost:8240
      - http://127.0.0.1:8240
    allow-credentials: true
    allow-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allow-headers: [Content-Type, Authorization, x-api-key, anthropic-version, anthropic-beta]

# SpringBootAI 统一日志配置。未单独指定 log_format 时使用框架默认格式，
# 控制台与文件格式保持一致；业务运行日志只写入项目根目录下的 log/。
logging:
  level: ${LOG_LEVEL:INFO}
  log_format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan> | <cyan>{file.path}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> | <level>{message}</level>"
  log_dir: ${LOG_DIR:./log}
  retention: ${LOG_RETENTION:30 days}
  rotation: ${LOG_ROTATION:100 MB}

# SpringBootAI's JWT initializer reads this top-level section. Keep the
# secret in an environment variable in production; the local value is only a
# development fallback and must be replaced before exposing the service.
jwt:
  secret_key: ${ROSE_JWT_SECRET:}
  expires_in: 259200

spring:
  swagger:
    enabled: false
    docs-url: null
    redoc-url: null
    openapi-url: null

springbootai:
  application:
    name: rose-ai-proxy
  ai:
    default-provider: openai
    allow-fake: true
    openai:
      # Codex / SpringBootAI 默认上游。生产环境可用环境变量覆盖，避免把
      # 密钥提交到版本库；当前默认值用于本机开箱即用。
      api-key: ${ROSE_OPENAI_API_KEY:}
      base-url: ${ROSE_OPENAI_BASE_URL:https://coloful-rose.com/v1}
      chat:
        model: ${OPENAI_MODEL:gpt-5.6-sol}
        temperature: ${OPENAI_TEMPERATURE:0.7}
        timeout: 180

# SpringBootAI PyMyBatis infrastructure. Mapper method signatures live in
# backend/mappers and all business SQL is loaded from the XML resource below.
# DataStore only performs schema bootstrap/compatibility work at startup;
# runtime reads and writes go through the injected Mapper proxy.
database:
  enabled: true
  orm: mybatis
  # sqlite 适合本地单机；切换 MySQL 时改为 mysql，并填写 database/username/password。
  driver: ${DB_DRIVER:${ROSE_DB_DRIVER:sqlite}}
  database: ${DB_NAME:${ROSE_DB_PATH:./data/rose.db}}
#  driver: ${DB_DRIVER:${ROSE_DB_DRIVER:mysql}}
#  database: ${DB_NAME:${ROSE_DB_PATH:rose_proxy}}
  host: ${DB_HOST:${ROSE_DB_HOST:127.0.0.1}}
  port: ${DB_PORT:${ROSE_DB_PORT:3306}}
  username: ${DB_USERNAME:${ROSE_DB_USERNAME:root}}
  password: ${DB_PASSWORD:${ROSE_DB_PASSWORD:}}
  charset: utf8mb4
  min_size: 1
  max_size: 8
  mapper_locations:
    - backend/mappers/StoreMapper.xml
    - backend/mappers/SubscriptionMapper.xml
  ddl-auto:
    mode: none
  security:
    # 关闭框架的启发式 SQL 注入检测，避免模型工具描述/用户提示词被误判。
    # 业务 SQL 仍全部使用 Mapper XML 参数绑定，不允许拼接 SQL。
    sql_injection_detection: ${ROSE_SQL_INJECTION_DETECTION:false}
    ast_validation_enabled: false
    block_ddl: true
    allow_raw_params: false

rose:
  application:
    name: ${ROSE_APPLICATION_NAME:大模型接口管理}
  monitoring:
    # 设为 false 后关闭 /api/monitoring，前端也会停止轮询并隐藏模型监控入口。
    enabled: ${ROSE_MONITORING_ENABLED:true}
  admin-config:
    # 管理员可在前端读取和修改项目固定的 application.yml。保存时会校验 YAML、
    # 检查并发修改并生成 application.yml.bak；普通用户无法访问对应接口。
    enabled: ${ROSE_ADMIN_CONFIG_ENABLED:true}
    max-bytes: ${ROSE_ADMIN_CONFIG_MAX_BYTES:1048576}
    # 重启只会调用项目内置 restart_backend.sh；这里仅控制接口返回后的延迟。
    restart-delay-seconds: ${ROSE_ADMIN_CONFIG_RESTART_DELAY_SECONDS:1}
  proxy-pool-admin:
    # 管理员代理订阅管理。默认关闭；启用时必须明确指向服务器上的受控代理池文件。
    # 页面只显示订阅名称、域名和节点数，完整订阅 URL 使用项目凭据密钥加密保存。
    enabled: ${ROSE_PROXY_POOL_ADMIN_ENABLED:false}
    monitor-config-path: ${ROSE_PROXY_POOL_MONITOR_CONFIG:./data/proxy-pool/monitor.json}
    monitor-state-path: ${ROSE_PROXY_POOL_MONITOR_STATE:./data/proxy-pool/state.json}
    subscription-registry-path: ${ROSE_PROXY_POOL_SUBSCRIPTION_REGISTRY:./data/proxy-pool/subscriptions.json}
    # 迁移时只需复制上述目录和这个 Mihomo 主配置；节点/provider 由订阅自动生成。
    profile-path: ${ROSE_PROXY_POOL_PROFILE:./data/proxy-pool/mihomo.yml}
    mihomo-binary: ${ROSE_PROXY_POOL_MIHOMO_BINARY:mihomo}
    # 定时检查远端订阅变化；管理员新增、删除、启停或手动同步时会立即生效。
    sync-interval-seconds: ${ROSE_PROXY_POOL_SYNC_INTERVAL_SECONDS:300}
    max-subscription-bytes: ${ROSE_PROXY_POOL_MAX_SUBSCRIPTION_BYTES:2097152}
    request-timeout-seconds: ${ROSE_PROXY_POOL_REQUEST_TIMEOUT_SECONDS:15}
    # 仅检测 Mihomo/Clash Meta 最新版本，不会自动下载、替换或重启代理核心。
    core-version-release-url: ${ROSE_PROXY_POOL_VERSION_RELEASE_URL:https://api.github.com/repos/MetaCubeX/mihomo/releases/latest}
  conversation:
    # 隐私模式：只记录调用元数据、Token、费用、状态和耗时，绝不保存
    # 用户问题、模型回答、原始 JSON、错误正文或图片。
    enabled: ${ROSE_CONVERSATION_ENABLED:true}
    # 0 表示永久保存；设置为正数后由后台定时任务清理过期记录。
    retention-days: ${ROSE_CONVERSATION_RETENTION_DAYS:0}
    store-content: false
    store-media: false
    # 旧版 media 配置仅为兼容已有安装；服务端不会再调用图片持久化流程。
    media:
      enabled: false
      directory: ${ROSE_CONVERSATION_MEDIA_DIR:./data/conversation-assets}
  api:
    # 对外提供给 OpenAI 兼容客户端的服务端地址；前端开发端口 8240 不应填写到第三方客户端。
    # 对外展示给 OpenAI/Codex 客户端的网关根地址，必须包含协议。
    # 生产部署可用 ROSE_PUBLIC_API_BASE_URL 覆盖，例如
    # https://api.example.com 或 http://10.34.150.114:8241。
    public-base-url: ${ROSE_PUBLIC_API_BASE_URL:http://www.yucg.cn:8241}
  security:
    # API Key 与兑换码使用不同前缀。兑换码由 rose.billing.recharge-code-prefix 控制。
    # 仅影响之后新建的 API Key；已有密钥保持不变，避免现有客户端突然失效。
    api-key-prefix: ${ROSE_API_KEY_PREFIX:sk-api-CODE}
  bootstrap:
    # 本地系统账户与参考站点账户解耦；生产环境请通过环境变量覆盖。
    admin-username: ${ROSE_ADMIN_USERNAME:admin}
    admin-password: ${ROSE_ADMIN_PASSWORD:}
    admin-email: ${ROSE_ADMIN_EMAIL:admin@example.com}
    # 管理员初始余额为 0；充值和兑换码到账后才增加余额。
    initial-balance: ${ROSE_INITIAL_BALANCE:0}
  password-recovery:
    # true：登录页显示“忘记密码”。先按用户名查询；已绑定邮箱的用户收到验证码，
    # 未绑定邮箱或用户名不正确时，可填写姓名和公司/学校，向管理员发送人工找回申请。
    enabled: ${ROSE_PASSWORD_RECOVERY_ENABLED:true}
    # 重置链接有效期（分钟）以及同一账号再次发送邮件前的等待时间（秒）。
    reset-token-minutes: ${ROSE_PASSWORD_RECOVERY_TOKEN_MINUTES:15}
    # 邮箱验证码有效期（分钟）以及最多允许输错的次数。验证成功后立即失效。
    verification-code-minutes: ${ROSE_PASSWORD_RECOVERY_CODE_MINUTES:5}
    verification-code-max-attempts: ${ROSE_PASSWORD_RECOVERY_CODE_MAX_ATTEMPTS:5}
    request-cooldown-seconds: ${ROSE_PASSWORD_RECOVERY_COOLDOWN_SECONDS:60}
    # 前端显示的预计送达时间，仅用于提示，不会延迟实际发送。
    mail-delivery-hint-seconds: ${ROSE_PASSWORD_RECOVERY_DELIVERY_HINT_SECONDS:60}
    # 邮件中的重置链接地址。生产环境应指向实际前端登录站点。
    frontend-base-url: ${ROSE_PASSWORD_RECOVERY_FRONTEND_BASE_URL:http://www.yucg.cn:8240}
    # 接收人工找回申请的管理员邮箱。
    admin-email: ${ROSE_PASSWORD_RECOVERY_ADMIN_EMAIL:admin@example.com}
    # 可单独配置签名密钥；留空时复用 jwt.secret_key。两者至少一个必须不少于 32 位。
    token-secret: ${ROSE_PASSWORD_RECOVERY_TOKEN_SECRET:}
    smtp:
      # 与考试系统一致，QQ 邮箱使用 smtp.qq.com:587 + STARTTLS；password 必须填写 SMTP 授权码。
      # 授权码只放服务器环境变量，禁止直接写入 YAML 或提交 GitHub。
      # SMTP 使用独立 IPv4 TCP 直连，不读取系统 HTTP/HTTPS/日本代理设置。
      use-proxy: false
      host: ${ROSE_PASSWORD_RECOVERY_SMTP_HOST:smtp.qq.com}
      # 可选直连 IPv4；TLS 主机名仍使用 host。服务器 DNS 命中不可用海外节点时再设置。
      connect-host: ${ROSE_PASSWORD_RECOVERY_SMTP_CONNECT_HOST:}
      port: ${ROSE_PASSWORD_RECOVERY_SMTP_PORT:587}
      ssl: ${ROSE_PASSWORD_RECOVERY_SMTP_SSL:false}
      username: ${ROSE_PASSWORD_RECOVERY_SMTP_USERNAME:}
      password: ${ROSE_PASSWORD_RECOVERY_SMTP_PASSWORD:}
      sender: ${ROSE_PASSWORD_RECOVERY_SMTP_SENDER:}
  subscription-gateway:
    # 允许普通用户贡献自己的订阅账号，并向管理员分享 DeepSeek、Kimi、Claude 等
    # 第三方账号的 URL、Token/API Key 与 Model ID。
    user-contributions-enabled: ${ROSE_SUBSCRIPTION_USER_CONTRIBUTIONS_ENABLED:true}
    # 可接入自己有权使用的 OpenAI、Claude、Grok、Kimi、GLM 与 MiniMax 账号。凭据在数据库中
    # 使用独立密钥加密；生产环境必须设置为随机值，修改后旧凭据需要重新授权。
    enabled: ${ROSE_SUBSCRIPTION_GATEWAY_ENABLED:true}
    # OpenAI/Codex 订阅账号优先；没有可用订阅账号时，将 GPT 请求转给这里指定的
    # rose.models 模型 ID。留空表示不启用 API 兜底，不会影响 Claude/Kimi 等请求。
    openai-fallback-model: ${ROSE_SUBSCRIPTION_OPENAI_FALLBACK_MODEL:}
    # Codex 订阅传输的版本兼容标识（不是模型授权）。留空时每 6 小时从官方
    # GitHub release 自动同步；显式填写后固定版本，不再自动更新。
    codex-client-version: ${ROSE_CODEX_CLIENT_VERSION:}
    codex-version-auto-sync: ${ROSE_CODEX_VERSION_AUTO_SYNC:true}
    codex-version-release-url: ${ROSE_CODEX_VERSION_RELEASE_URL:https://api.github.com/repos/openai/codex/releases/latest}
    # Claude Code 同样默认跟随官方最新稳定版；填写后固定版本。
    claude-client-version: ${ROSE_CLAUDE_CLIENT_VERSION:}
    claude-version-auto-sync: ${ROSE_CLAUDE_VERSION_AUTO_SYNC:true}
    claude-version-release-url: ${ROSE_CLAUDE_VERSION_RELEASE_URL:https://api.github.com/repos/anthropics/claude-code/releases/latest}
    # Grok Build OAuth 访问 CLI Responses 接口时使用的兼容版本标识。
    grok-client-version: ${ROSE_GROK_CLIENT_VERSION:0.2.120}
    # pass：校验并透传（fast 会规范为 priority）；filter：删除；
    # force_priority：无论客户端是否提供都强制 priority。
    openai-service-tier-policy: ${ROSE_OPENAI_SERVICE_TIER_POLICY:pass}
    credential-secret: ${ROSE_SUBSCRIPTION_CREDENTIAL_SECRET:}
    oauth-timeout-seconds: ${ROSE_SUBSCRIPTION_OAUTH_TIMEOUT_SECONDS:60}
    # true：自动扫描即将过期的 OAuth Token；默认在距离过期 1 天内提前刷新。
    token-refresh-enabled: ${ROSE_SUBSCRIPTION_TOKEN_REFRESH_ENABLED:true}
    token-refresh-ahead-seconds: ${ROSE_SUBSCRIPTION_TOKEN_REFRESH_AHEAD_SECONDS:86400}
    request-timeout-seconds: ${ROSE_SUBSCRIPTION_REQUEST_TIMEOUT_SECONDS:600}
    connect-timeout-seconds: ${ROSE_SUBSCRIPTION_CONNECT_TIMEOUT_SECONDS:10}
    # Windows/macOS 会通过 Python 系统代理发现机制读取操作系统代理；Linux
    # 读取 HTTP_PROXY/HTTPS_PROXY/NO_PROXY。可显式设为 false 强制直连。
    trust-env: ${ROSE_SUBSCRIPTION_TRUST_ENV:true}
    max-account-attempts: ${ROSE_SUBSCRIPTION_MAX_ATTEMPTS:3}
    # 模型容量不足可能以 HTTP 200 内的 response.failed 返回。仅在尚未向
    # 客户端输出正文/工具参数时自动重试，避免重复回答或重复执行工具。
    capacity-retries: ${ROSE_SUBSCRIPTION_CAPACITY_RETRIES:2}
    capacity-retry-base-seconds: ${ROSE_SUBSCRIPTION_CAPACITY_RETRY_BASE_SECONDS:1}
    stream-prefetch-bytes: ${ROSE_SUBSCRIPTION_STREAM_PREFETCH_BYTES:65536}
    # false：记录失败原因并在当前请求内切换账号，但不让订阅账号进入临时冷却。
    # 401/403 凭据失效仍会标记为 INVALID，避免持续使用无效凭据。
    account-cooldown-enabled: ${ROSE_SUBSCRIPTION_ACCOUNT_COOLDOWN_ENABLED:false}
    max-connections: ${ROSE_SUBSCRIPTION_MAX_CONNECTIONS:100}
    max-keepalive-connections: ${ROSE_SUBSCRIPTION_MAX_KEEPALIVE_CONNECTIONS:20}
    # 合规保护：不模拟浏览器或人为操作，只限制单账号并发/突发流量，并把显式
    # 客户端会话稳定地粘连到同一健康账号。无法保证上游账号不会受限或封禁。
    per-account-max-concurrency: ${ROSE_SUBSCRIPTION_ACCOUNT_CONCURRENCY:3}
    per-account-requests-per-minute: ${ROSE_SUBSCRIPTION_ACCOUNT_RPM:20}
    # Codex 长上下文请求可能持续数分钟；默认一直等待账号槽位，
    # 不产生本地排队超时。需要限制等待时间时可设置为正数秒。
    account-queue-timeout-seconds: ${ROSE_SUBSCRIPTION_QUEUE_TIMEOUT_SECONDS:0}
    # 即使设置为无限等待，也限制进程内累计排队数量，避免连接无限堆积。
    max-queued-requests: ${ROSE_SUBSCRIPTION_MAX_QUEUED_REQUESTS:200}
    session-affinity-ttl-seconds: ${ROSE_SUBSCRIPTION_SESSION_AFFINITY_TTL_SECONDS:3600}
    # 管理后台订阅用量缓存；查询不进入正常模型转发链路。
    quota-cache-seconds: ${ROSE_SUBSCRIPTION_QUOTA_CACHE_SECONDS:300}
    # true：普通用户可只读查看共享 OpenAI/Codex 账号的订阅剩余量；管理员始终可见。
    # 普通用户（包括账号所有者）随页面查询并复用 5 分钟缓存；只有管理员可强制刷新上游。
    quota-visible-to-users: ${ROSE_SUBSCRIPTION_QUOTA_VISIBLE_TO_USERS:true}
    # 只看每周窗口；剩余量低于该百分比时停用账号，等待管理员处理。5 小时窗口不参与判断。
    weekly-quota-disable-threshold-percent: ${ROSE_SUBSCRIPTION_WEEKLY_DISABLE_THRESHOLD_PERCENT:2}
  user-groups:
    # true：普通用户可查看自己当前生效分组的策略和汇总用量。
    # false：隐藏普通用户的“我的分组”入口并禁止访问概况接口；管理员始终可见。
    overview-visible-to-users: ${ROSE_USER_GROUP_OVERVIEW_VISIBLE_TO_USERS:true}
    # true：普通用户可查看本组成员名单及累计花费、Token、请求数和最近登录；只读且无管理入口。
    # false：普通用户只看分组策略和汇总数据；管理员仍可查看成员。
    member-usage-visible-to-users: ${ROSE_USER_GROUP_MEMBER_USAGE_VISIBLE_TO_USERS:true}
  data-visualization:
    # true：普通用户可查看 4 个全站匿名汇总图表（请求趋势、Token/费用、活跃用户、模型用量）。
    # 普通用户始终不会获得用户排行、计费来源或订单数据；false 时隐藏入口并禁止访问。
    visible-to-users: ${ROSE_DATA_VISUALIZATION_VISIBLE_TO_USERS:true}
  proxy:
    enabled: true
    default-model: ${ROSE_PROXY_MODEL:gpt-5.6-sol}
    # GPT 请求缺少强度，或传入 none/非法档位时使用此档位；修改后重启后端生效。
    default-gpt-reasoning-effort: high
    demo-mode-when-key-missing: true
    # 上游转发连接池。客户端按事件循环复用 TCP/TLS 连接，避免每次
    # 请求重新握手；调整这些参数无需修改代码。http2 需要安装 h2，
    # 未安装时会自动回退 HTTP/1.1 keep-alive。
    transport:
      http2: ${ROSE_UPSTREAM_HTTP2:false}
      max-connections: ${ROSE_UPSTREAM_MAX_CONNECTIONS:100}
      max-keepalive-connections: ${ROSE_UPSTREAM_MAX_KEEPALIVE_CONNECTIONS:20}
      keepalive-expiry-seconds: ${ROSE_UPSTREAM_KEEPALIVE_EXPIRY_SECONDS:60}
      connect-timeout-seconds: ${ROSE_UPSTREAM_CONNECT_TIMEOUT_SECONDS:10}
      pool-timeout-seconds: ${ROSE_UPSTREAM_POOL_TIMEOUT_SECONDS:30}
      trust-env: ${ROSE_UPSTREAM_TRUST_ENV:false}
      # 仅连接失败、429、5xx 时重试；流式已输出内容后绝不重放。
      max-retries: ${ROSE_UPSTREAM_MAX_RETRIES:1}
      retry-delay-ms: ${ROSE_UPSTREAM_RETRY_DELAY_MS:200}
    # 模型目录和监控页按此配置自动探测上游 /models，状态会缓存指定秒数。
    health-check:
      interval-seconds: ${ROSE_HEALTH_INTERVAL_SECONDS:60}
      timeout-seconds: ${ROSE_HEALTH_TIMEOUT_SECONDS:5}
    max-tokens-per-request: 100000
    request-timeout-seconds: 180
  # DeepSeek 模型已停用，以下保留配置为注释；恢复时需取消注释并配置密钥。
  # OpenAI / Claude / Grok / Kimi / GLM / MiniMax 账号池模型不受此列表影响。
  # 每个 URL/API Key/Model ID 可在自己的模型条目内单独设置 use-proxy；
  # false 表示直连，true 表示读取服务器代理环境变量。旧字段 trust-env 仍兼容。
  models: []
    # 与 subscription-gateway.openai-fallback-model 配套的 API 兜底示例：
    # - id: openai
    #   enabled: true
    #   provider: OpenAI
    #   endpoint: Responses
    #   group: OpenAI API Fallback
    #   # 兜底时实际透传客户端请求的 OpenAI 模型名。
    #   upstream-model: openai
    #   # 一个连接配置可在模型广场、监控和用户组中展示多个实际模型。
    #   catalog-models: [codex-auto-review, gpt-5.5, gpt-5.6-sol, gpt-5.6-terra, gpt-6-astra]
    #   base-url: ${ROSE_OPENAI_FALLBACK_BASE_URL:https://api.example.com/v1}
    #   api-key: ${ROSE_OPENAI_FALLBACK_API_KEY:}
    #   use-proxy: false
    #   timeout-seconds: 180
    #   demo-mode-when-key-missing: false
    # - id: deepseek-v4-flash
    #   enabled: true
    #   provider: DeepSeek
    #   endpoint: Chat
    #   group: DeepSeek V4
    #   upstream-model: deepseek-v4-flash
    #   base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    #   api-key: ${DEEPSEEK_API_KEY:}
    #   temperature: ${DEEPSEEK_TEMPERATURE:0.7}
    #   timeout-seconds: 180
    #   demo-mode-when-key-missing: false
    #   currency: CNY
    #   pricing:
    #     # DeepSeek 价格按人民币配置，单位为元 / 1M tokens，可用环境变量覆盖。
    #     input-cny-per-million: ${DEEPSEEK_V4_FLASH_INPUT_CNY_PER_MILLION:2}
    #     output-cny-per-million: ${DEEPSEEK_V4_FLASH_OUTPUT_CNY_PER_MILLION:8}
    #     cache-cny-per-million: ${DEEPSEEK_V4_FLASH_CACHE_CNY_PER_MILLION:2}
    #     multiplier: 1.0
    #   description: DeepSeek V4 Flash，适合高吞吐对话和代码任务。
